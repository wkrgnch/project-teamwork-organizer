<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Создание заявки</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4">
    <div class="form-container">
        <div class="page-card">
            <h1 class="page-title">Создание заявки</h1>
            <p class="text-muted">
                Проект:
                <strong th:text="${project.name}">Название проекта</strong>
            </p>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}">
                Ошибка
            </div>

            <form th:action="@{/projects/{projectId}/requests(projectId=${project.id})}"
                  th:object="${requestForm}"
                  method="post">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="mb-3">
                    <label for="title" class="form-label">Название заявки</label>
                    <input id="title" type="text" th:field="*{title}" class="form-control">
                    <div class="text-danger small" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                </div>

                <div class="mb-3">
                    <label for="goal" class="form-label">Цель</label>
                    <textarea id="goal" th:field="*{goal}" class="form-control" rows="2"></textarea>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Описание</label>
                    <textarea id="description" th:field="*{description}" class="form-control" rows="4"></textarea>
                    <div class="text-danger small" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                </div>

                <div class="mb-3">
                    <label for="expectedResult" class="form-label">Ожидаемый результат</label>
                    <textarea id="expectedResult" th:field="*{expectedResult}" class="form-control" rows="3"></textarea>
                    <div class="text-danger small" th:if="${#fields.hasErrors('expectedResult')}" th:errors="*{expectedResult}"></div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="desiredDeadline" class="form-label">Желаемый срок</label>
                        <input id="desiredDeadline" type="date" th:field="*{desiredDeadline}" class="form-control">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="materialUrl" class="form-label">Ссылка на материалы</label>
                        <input id="materialUrl" type="text" th:field="*{materialUrl}" class="form-control"
                               placeholder="Например: ссылка на документ или файл">
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Создать заявку</button>

                    <a class="btn btn-outline-secondary"
                       th:href="@{/projects/{projectId}/requests(projectId=${project.id})}">
                        Отмена
                    </a>
                </div>
            </form>
        </div>
    </div>
</main>

</body>
</html>
