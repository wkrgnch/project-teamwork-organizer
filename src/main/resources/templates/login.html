<h1>Вход в систему</h1>

<div th:if="${param.error}">
    <p style="color: red;">Неверный логин или пароль</p>
</div>

<div th:if="${param.logout}">
    <p style="color: green;">Вы вышли из системы</p>
</div>

<div th:if="${param.registered}">
    <p style="color: green;">Регистрация успешна. Теперь войдите в систему.</p>
</div>

<form th:action="@{/login}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

    <div>
        <label for="username">Логин</label><br>
        <input id="username" type="text" name="username">
    </div>

    <br>

    <div>
        <label for="password">Пароль</label><br>
        <input id="password" type="password" name="password">
    </div>

    <br>

    <button type="submit">Войти</button>
</form>

<p>
    Нет аккаунта?
    <a th:href="@{/register}">Зарегистрироваться</a>
</p>
