<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Доска проекта: ' + ${project.name}">Доска проекта</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container-fluid py-4">
    <div class="page-card mb-4">
        <div class="d-flex justify-content-between align-items-start gap-3">
            <div>
                <h1 class="page-title mb-2" th:text="${project.name}">Название проекта</h1>
                <p class="text-muted mb-0">
                    Методология:
                    <strong th:text="${project.methodology}">KANBAN</strong>
                </p>
            </div>

            <div class="d-flex gap-2 flex-wrap justify-content-end">
                <a class="btn btn-outline-secondary"
                   th:href="@{/projects/{id}(id=${project.id})}">
                    К проекту
                </a>

                <a class="btn btn-primary"
                   th:if="${canManageProject}"
                   th:href="@{/projects/{id}/tasks/new(id=${project.id})}">
                    Создать задачу
                </a>
            </div>
        </div>
    </div>

    <div class="board">
        <div class="stage-column" th:each="boardStatus : ${boardStatuses}">
            <h2 class="stage-title" th:text="${taskStatusLabels.get(boardStatus)}">
                Новые
            </h2>

            <div th:with="statusTasks=${tasksByStatus.get(boardStatus)}">
                <div class="empty-column" th:if="${statusTasks == null || statusTasks.isEmpty()}">
                    Задач нет
                </div>

                <div class="task-card" th:each="task : ${statusTasks}">
                    <div class="task-title" th:text="${task.title}">
                        Название задачи
                    </div>

                    <div class="task-meta">
                        Текущий статус:
                        <strong th:text="${taskStatusLabels.get(task.status)}">Новые</strong>
                    </div>

                    <div class="task-meta">
                        Этап проекта:
                        <span th:text="${task.stage != null ? task.stage.name : 'Не указан'}">
                        Этап проекта
                    </span>
                    </div>

                    <div class="task-meta">
                        Приоритет:
                        <strong th:text="${task.priority}">MEDIUM</strong>
                    </div>

                    <div class="task-meta">
                        Тип работы:
                        <span th:text="${task.workType.type}">Разработка</span>
                    </div>

                    <div class="task-meta">
                        Исполнитель:
                        <span th:text="${task.assignee != null ? task.assignee.fullName : 'Не назначен'}">
                        Не назначен
                    </span>
                    </div>

                    <div class="task-meta" th:if="${project.methodology.name() == 'SCRUM'}">
                        Спринт:
                        <span th:text="${task.sprint != null ? task.sprint.name : 'Без спринта'}">
                        Без спринта
                    </span>
                    </div>

                    <div class="task-meta">
                        Дедлайн:
                        <span th:text="${task.deadline != null ? #temporals.format(task.deadline, 'dd.MM.yyyy') : 'Не указан'}">
                        Не указан
                    </span>
                    </div>

                    <a class="btn btn-sm btn-outline-secondary mt-2"
                       th:href="@{/tasks/{id}(id=${task.id})}">
                        Открыть задачу
                    </a>

                    <form th:action="@{/tasks/{taskId}/status(taskId=${task.id})}"
                          method="post"
                          class="mt-3">

                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <label class="form-label small">Изменить статус</label>

                        <select name="status" class="form-select form-select-sm">
                            <option th:each="availableStatus : ${taskStatuses}"
                                    th:value="${availableStatus}"
                                    th:text="${taskStatusLabels.get(availableStatus)}"
                                    th:selected="${availableStatus == task.status}">
                                Новые
                            </option>
                        </select>

                        <button type="submit" class="btn btn-sm btn-primary mt-2">
                            Сохранить
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
<script th:src="@{/js/theme.js}"></script>
</body>
</html>
