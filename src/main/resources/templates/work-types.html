<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Типы работ</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4">
    <div class="page-card">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h1 class="page-title mb-1">Типы работ</h1>
                <p class="text-muted mb-0">Справочник типов работ для задач.</p>
            </div>

            <a class="btn btn-outline-secondary" th:href="@{/projects}">
                Назад к проектам
            </a>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Тип</th>
                    <th>Описание</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="workType : ${workTypes}">
                    <td th:text="${workType.id}">1</td>
                    <td class="fw-semibold" th:text="${workType.type}">Тип работы</td>
                    <td th:text="${workType.description}">Описание</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

</body>
</html>
