<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Публичные проекты</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            Project Teamwork Organizer
        </a>

        <div class="d-flex gap-2">
            <a class="btn btn-outline-light btn-sm" th:href="@{/login}">
                Войти
            </a>
            <a class="btn btn-primary btn-sm" th:href="@{/register}">
                Зарегистрироваться
            </a>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="page-card mb-4">
        <h1 class="page-title mb-2">Публичные проекты</h1>
        <p class="text-muted mb-3">
            Здесь отображаются проекты, которые были опубликованы для открытого просмотра.
        </p>

        <form th:action="@{/public/projects}" method="get" class="row g-2">
            <div class="col-md-10">
                <input type="text" name="query" class="form-control"
                       th:value="${query}"
                       placeholder="Поиск по названию проекта">
            </div>

            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">
                    Найти
                </button>
            </div>
        </form>
    </div>

    <div th:if="${projects.isEmpty()}" class="alert alert-info">
        Публичные проекты не найдены.
    </div>

    <div class="row g-3" th:if="${!projects.isEmpty()}">
        <div class="col-md-6 col-lg-4" th:each="project : ${projects}">
            <div class="page-card h-100">
                <h2 class="h5" th:text="${project.name}">Название проекта</h2>

                <p class="text-muted small"
                   th:text="${project.publicDescription != null && !project.publicDescription.isBlank() ? project.publicDescription : project.description}">
                    Описание проекта
                </p>

                <div class="mb-3">
                    <span class="badge text-bg-secondary" th:text="${project.methodology}">KANBAN</span>
                    <span class="badge text-bg-light border" th:text="${project.status}">ACTIVE</span>
                </div>

                <a class="btn btn-sm btn-outline-primary"
                   th:href="@{/public/projects/{id}(id=${project.id})}">
                    Открыть карточку
                </a>
            </div>
        </div>
    </div>
</main>

</body>
</html>
