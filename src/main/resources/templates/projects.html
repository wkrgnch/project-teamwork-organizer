<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Проекты</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4">
    <div class="page-card">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h1 class="page-title mb-1">Мои проекты</h1>
                <p class="text-muted mb-0">Список проектов, в которых вы состоите.</p>
            </div>

            <a class="btn btn-primary" th:href="@{/projects/new}">
                Создать проект
            </a>
        </div>

        <div th:if="${projects.isEmpty()}" class="alert alert-info">
            Проекты пока не созданы или вы не добавлены ни в один проект.
        </div>

        <div class="table-responsive" th:if="${!projects.isEmpty()}">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>Название</th>
                    <th>Методология</th>
                    <th>Статус</th>
                    <th>Дата начала</th>
                    <th>Дата окончания</th>
                    <th>Публичный</th>
                    <th>Действия</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="project : ${projects}">
                    <td class="fw-semibold" th:text="${project.name}">Название проекта</td>
                    <td>
                        <span class="badge text-bg-secondary" th:text="${project.methodology}">SCRUM</span>
                    </td>
                    <td th:text="${project.status}">ACTIVE</td>
                    <td th:text="${#temporals.format(project.startDate, 'dd.MM.yyyy')}">14.05.2026</td>
                    <td th:text="${project.endDate != null ? #temporals.format(project.endDate, 'dd.MM.yyyy') : 'Не указана'}">
                        Не указана
                    </td>
                    <td th:text="${project.publicProject ? 'Да' : 'Нет'}">Нет</td>
                    <td>
                        <a class="btn btn-sm btn-outline-primary"
                           th:href="@{/projects/{id}(id=${project.id})}">
                            Открыть
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<script th:src="@{/js/theme.js}"></script>
</body>
</html>
