<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Удаление профиля</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4">
    <div class="form-container">
        <div class="page-card">
            <h1 class="page-title mb-3">Удаление профиля</h1>

            <div class="alert alert-warning">
                Профиль будет деактивирован! Вход в систему станет невозможен.
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}">
                Ошибка
            </div>

            <form th:action="@{/profile/delete}" th:object="${deleteForm}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="mb-4">
                    <label for="currentPassword" class="form-label">Введите текущий пароль для подтверждения</label>
                    <input id="currentPassword" type="password" th:field="*{currentPassword}" class="form-control">
                    <div class="text-danger small" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-danger">Удалить профиль</button>
                    <a class="btn btn-outline-secondary" th:href="@{/profile}">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</main>
<script th:src="@{/js/theme.js}"></script>
</body>
</html>
