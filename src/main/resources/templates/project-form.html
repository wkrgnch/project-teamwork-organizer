<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Создание проекта</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4">
    <div class="form-container">
        <div class="page-card">
            <h1 class="page-title">Создание проекта</h1>

            <form th:action="@{/projects}" th:object="${projectForm}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="mb-3">
                    <label for="name" class="form-label">Название проекта</label>
                    <input id="name" type="text" th:field="*{name}" class="form-control">
                    <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Описание</label>
                    <textarea id="description" th:field="*{description}" class="form-control" rows="4"></textarea>
                </div>

                <div class="mb-3">
                    <label for="publicDescription" class="form-label">Публичное описание</label>
                    <textarea id="publicDescription" th:field="*{publicDescription}" class="form-control" rows="3"></textarea>
                </div>

                <div class="mb-3">
                    <label for="methodology" class="form-label">Методология</label>
                    <select id="methodology" th:field="*{methodology}" class="form-select">
                        <option value="">Выберите методологию</option>
                        <option th:each="methodology : ${methodologies}"
                                th:value="${methodology}"
                                th:text="${methodology}">
                            SCRUM
                        </option>
                    </select>
                    <div class="text-danger small" th:if="${#fields.hasErrors('methodology')}" th:errors="*{methodology}"></div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="startDate" class="form-label">Дата начала</label>
                        <input id="startDate" type="date" th:field="*{startDate}" class="form-control">
                        <div class="text-danger small" th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="endDate" class="form-label">Дата окончания</label>
                        <input id="endDate" type="date" th:field="*{endDate}" class="form-control">
                    </div>
                </div>

                <div class="form-check mb-4">
                    <input id="publicProject" type="checkbox" th:field="*{publicProject}" class="form-check-input">
                    <label for="publicProject" class="form-check-label">
                        Публичный проект
                    </label>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        Создать проект
                    </button>

                    <a class="btn btn-outline-secondary" th:href="@{/projects}">
                        Назад к проектам
                    </a>
                </div>
            </form>
        </div>
    </div>
</main>
<script th:src="@{/js/theme.js}"></script>
</body>
</html>
