<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Журнал действий</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4">
    <div class="page-card">
        <div class="d-flex justify-content-between align-items-start gap-3 mb-3">
            <div>
                <h1 class="page-title mb-2">Журнал действий пользователей</h1>
                <p class="text-muted mb-0">
                    История основных действий, выполненных в системе.
                </p>
            </div>

            <a class="btn btn-outline-secondary" th:href="@{/admin}">
                Назад в панель администратора
            </a>
        </div>

        <div th:if="${logs.isEmpty()}" class="alert alert-info">
            Записей в журнале пока нет.
        </div>

        <div class="table-responsive" th:if="${!logs.isEmpty()}">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>Дата</th>
                    <th>Пользователь</th>
                    <th>Действие</th>
                    <th>Объект</th>
                    <th>Описание</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="log : ${logs}">
                    <td th:text="${#temporals.format(log.createdAt, 'dd.MM.yyyy HH:mm')}">31.05.2026 02:30</td>
                    <td th:text="${log.actorUser != null ? log.actorUser.username : 'Система'}">user</td>
                    <td>
                        <span class="badge text-bg-secondary" th:text="${log.actionType}">CREATE_TASK</span>
                    </td>
                    <td>
                        <span th:text="${log.objectType}">TASK</span>
                        <span th:if="${log.objectName != null}" th:text="${' — ' + log.objectName}"> — объект</span>
                    </td>
                    <td th:text="${log.description}">Описание действия</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

</body>
</html>
