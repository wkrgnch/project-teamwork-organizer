<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Смена пароля</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4">
    <div class="form-container">
        <div class="page-card">
            <h1 class="page-title mb-3">Смена пароля</h1>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}">
                Ошибка
            </div>

            <form th:action="@{/profile/password}" th:object="${passwordForm}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="mb-3">
                    <label for="currentPassword" class="form-label">Текущий пароль</label>
                    <input id="currentPassword" type="password" th:field="*{currentPassword}" class="form-control">
                    <div class="text-danger small" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></div>
                </div>

                <div class="mb-3">
                    <label for="newPassword" class="form-label">Новый пароль</label>
                    <input id="newPassword" type="password" th:field="*{newPassword}" class="form-control">
                    <div class="text-danger small" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                </div>

                <div class="mb-4">
                    <label for="confirmPassword" class="form-label">Повтор нового пароля</label>
                    <input id="confirmPassword" type="password" th:field="*{confirmPassword}" class="form-control">
                    <div class="text-danger small" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Сохранить пароль</button>
                    <a class="btn btn-outline-secondary" th:href="@{/profile}">Назад</a>
                </div>
            </form>
        </div>
    </div>
</main>

</body>
</html>
