<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Создание задачи</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4">
    <div class="form-container">
        <div class="page-card">
            <h1 class="page-title">Создание задачи</h1>

            <p class="text-muted">
                Проект:
                <strong th:text="${project.name}">Название проекта</strong>
            </p>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}">
                Ошибка
            </div>

            <form th:action="@{/projects/{projectId}/tasks(projectId=${project.id})}"
                  th:object="${taskForm}"
                  method="post">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="mb-3">
                    <label for="title" class="form-label">Название задачи</label>
                    <input id="title" type="text" th:field="*{title}" class="form-control">
                    <div class="text-danger small" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Описание</label>
                    <textarea id="description" th:field="*{description}" class="form-control" rows="4"></textarea>
                    <div class="text-danger small" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                </div>

                <div class="mb-3">
                    <label for="stageId" class="form-label">Этап проекта</label>
                    <select id="stageId" th:field="*{stageId}" class="form-select">
                        <option value="">Выберите этап проекта</option>
                        <option th:each="stage : ${stages}"
                                th:value="${stage.id}"
                                th:text="${stage.name}">
                            Этап проекта
                        </option>
                    </select>
                    <div class="text-danger small" th:if="${#fields.hasErrors('stageId')}" th:errors="*{stageId}"></div>
                </div>

                <div class="mb-3" th:if="${project.methodology.name() == 'SCRUM'}">
                    <label for="sprintId" class="form-label">Спринт</label>
                    <select id="sprintId" th:field="*{sprintId}" class="form-select">
                        <option value="">Без спринта</option>
                        <option th:each="sprint : ${sprints}"
                                th:value="${sprint.id}"
                                th:text="${sprint.name}">
                            Спринт 1
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="workTypeId" class="form-label">Тип работы</label>
                    <select id="workTypeId" th:field="*{workTypeId}" class="form-select">
                        <option value="">Выберите тип работы</option>
                        <option th:each="workType : ${workTypes}"
                                th:value="${workType.id}"
                                th:text="${workType.type}">
                            Разработка
                        </option>
                    </select>
                    <div class="text-danger small" th:if="${#fields.hasErrors('workTypeId')}" th:errors="*{workTypeId}"></div>
                </div>

                <div class="mb-3">
                    <label for="priority" class="form-label">Приоритет</label>
                    <select id="priority" th:field="*{priority}" class="form-select">
                        <option value="">Выберите приоритет</option>
                        <option th:each="priority : ${priorities}"
                                th:value="${priority}"
                                th:text="${priority}">
                            MEDIUM
                        </option>
                    </select>
                    <div class="text-danger small" th:if="${#fields.hasErrors('priority')}" th:errors="*{priority}"></div>
                </div>

                <div class="mb-3">
                    <label for="assigneeId" class="form-label">Исполнитель</label>
                    <select id="assigneeId" th:field="*{assigneeId}" class="form-select">
                        <option value="">Без исполнителя</option>
                        <option th:each="member : ${members}"
                                th:value="${member.user.id}"
                                th:text="${member.user.fullName + ' (' + member.user.username + ')'}">
                            Исполнитель
                        </option>
                    </select>
                </div>

                <div class="mb-4">
                    <label for="deadline" class="form-label">Дедлайн</label>
                    <input id="deadline" type="date" th:field="*{deadline}" class="form-control">
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        Создать задачу
                    </button>

                    <a class="btn btn-outline-secondary"
                       th:href="@{/projects/{id}(id=${project.id})}">
                        Назад к проекту
                    </a>
                </div>
            </form>
        </div>
    </div>
</main>

</body>
</html>
