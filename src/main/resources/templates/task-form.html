<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Создание задачи</title>
</head>
<body>

<h1>Создание задачи</h1>

<p>
    Проект:
    <strong th:text="${project.name}">Название проекта</strong>
</p>

<div th:if="${errorMessage}">
    <p style="color: red;" th:text="${errorMessage}">Ошибка</p>
</div>

<form th:action="@{/projects/{projectId}/tasks(projectId=${project.id})}"
      th:object="${taskForm}"
      method="post">

    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

    <div>
        <label for="title">Название задачи</label><br>
        <input id="title" type="text" th:field="*{title}">
        <div th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
    </div>

    <br>

    <div>
        <label for="description">Описание</label><br>
        <textarea id="description" th:field="*{description}"></textarea>
        <div th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
    </div>

    <br>

    <div>
        <label for="stageId">Стадия</label><br>
        <select id="stageId" th:field="*{stageId}">
            <option value="">Выберите стадию</option>
            <option th:each="stage : ${stages}"
                    th:value="${stage.id}"
                    th:text="${stage.name}">
                Стадия
            </option>
        </select>
        <div th:if="${#fields.hasErrors('stageId')}" th:errors="*{stageId}"></div>
    </div>

    <br>

    <div th:if="${!sprints.isEmpty()}">
        <label for="sprintId">Спринт</label><br>
        <select id="sprintId" th:field="*{sprintId}">
            <option value="">Без спринта</option>
            <option th:each="sprint : ${sprints}"
                    th:value="${sprint.id}"
                    th:text="${sprint.name}">
                Спринт 1
            </option>
        </select>
    </div>

    <br>

    <div>
        <label for="workTypeId">Тип работы</label><br>
        <select id="workTypeId" th:field="*{workTypeId}">
            <option value="">Выберите тип работы</option>
            <option th:each="workType : ${workTypes}"
                    th:value="${workType.id}"
                    th:text="${workType.type}">
                Разработка
            </option>
        </select>
        <div th:if="${#fields.hasErrors('workTypeId')}" th:errors="*{workTypeId}"></div>
    </div>

    <br>

    <div>
        <label for="priority">Приоритет</label><br>
        <select id="priority" th:field="*{priority}">
            <option value="">Выберите приоритет</option>
            <option th:each="priority : ${priorities}"
                    th:value="${priority}"
                    th:text="${priority}">
                MEDIUM
            </option>
        </select>
        <div th:if="${#fields.hasErrors('priority')}" th:errors="*{priority}"></div>
    </div>

    <br>

    <div>
        <label for="assigneeId">Исполнитель</label><br>
        <select id="assigneeId" th:field="*{assigneeId}">
            <option value="">Без исполнителя</option>
            <option th:each="member : ${members}"
                    th:value="${member.user.id}"
                    th:text="${member.user.fullName + ' (' + member.user.username + ')'}">
                Исполнитель
            </option>
        </select>
    </div>

    <br>

    <div>
        <label for="deadline">Дедлайн</label><br>
        <input id="deadline" type="date" th:field="*{deadline}">
    </div>

    <br>

    <button type="submit">Создать задачу</button>
</form>

<p>
    <a th:href="@{/projects/{id}(id=${project.id})}">
        Назад к проекту
    </a>
</p>

</body>
</html>
