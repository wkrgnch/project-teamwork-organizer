<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${project.name}">Публичный проект</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            Project Teamwork Organizer
        </a>

        <div class="d-flex gap-2">
            <a class="btn btn-outline-light btn-sm" th:href="@{/public/projects}">
                Публичные проекты
            </a>
            <a class="btn btn-outline-light btn-sm" th:href="@{/login}">
                Войти
            </a>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="page-card mb-4">
        <div class="d-flex justify-content-between align-items-start gap-3">
            <div>
                <h1 class="page-title mb-2" th:text="${project.name}">Название проекта</h1>
                <p class="text-muted mb-0"
                   th:text="${project.publicDescription != null && !project.publicDescription.isBlank() ? project.publicDescription : project.description}">
                    Публичное описание проекта
                </p>
            </div>

            <a class="btn btn-outline-secondary" th:href="@{/public/projects}">
                Назад
            </a>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-5">
            <div class="page-card h-100">
                <h2 class="h4 mb-3">Информация о проекте</h2>

                <table class="table table-sm">
                    <tbody>
                    <tr>
                        <th>Методология</th>
                        <td><span class="badge text-bg-secondary" th:text="${project.methodology}">KANBAN</span></td>
                    </tr>
                    <tr>
                        <th>Статус</th>
                        <td th:text="${project.status}">ACTIVE</td>
                    </tr>
                    <tr>
                        <th>Дата начала</th>
                        <td th:text="${#temporals.format(project.startDate, 'dd.MM.yyyy')}">01.06.2026</td>
                    </tr>
                    <tr>
                        <th>Дата окончания</th>
                        <td th:text="${project.endDate != null ? #temporals.format(project.endDate, 'dd.MM.yyyy') : 'Не указана'}">
                            Не указана
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="col-lg-7">
            <div class="page-card h-100">
                <h2 class="h4 mb-3">Этапы проекта</h2>

                <div th:if="${stages.isEmpty()}" class="alert alert-info">
                    Этапы проекта не указаны.
                </div>

                <div class="table-responsive" th:if="${!stages.isEmpty()}">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                        <tr>
                            <th>Этап</th>
                            <th>Описание</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="stage : ${stages}">
                            <td class="fw-semibold" th:text="${stage.name}">Название этапа</td>
                            <td th:text="${stage.description}">Описание этапа</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

</body>
</html>
