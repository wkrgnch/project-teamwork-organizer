<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Создание спринта</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4">
    <div class="form-container">
        <div class="page-card">
            <h1 class="page-title">Создание спринта</h1>

            <p class="text-muted">
                Проект:
                <strong th:text="${project.name}">Название проекта</strong>
            </p>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}">
                Ошибка
            </div>

            <form th:action="@{/projects/{projectId}/sprints(projectId=${project.id})}"
                  th:object="${sprintForm}"
                  method="post">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="mb-3">
                    <label for="name" class="form-label">Название спринта</label>
                    <input id="name" type="text" th:field="*{name}" class="form-control">
                    <div class="text-danger small"
                         th:if="${#fields.hasErrors('name')}"
                         th:errors="*{name}">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="goal" class="form-label">Цель спринта</label>
                    <textarea id="goal" th:field="*{goal}" class="form-control" rows="3"></textarea>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="startDate" class="form-label">Дата начала</label>
                        <input id="startDate" type="date" th:field="*{startDate}" class="form-control">
                        <div class="text-danger small"
                             th:if="${#fields.hasErrors('startDate')}"
                             th:errors="*{startDate}">
                        </div>
                    </div>

                    <div class="col-md-6 mb-4">
                        <label for="endDate" class="form-label">Дата окончания</label>
                        <input id="endDate" type="date" th:field="*{endDate}" class="form-control">
                        <div class="text-danger small"
                             th:if="${#fields.hasErrors('endDate')}"
                             th:errors="*{endDate}">
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        Создать спринт
                    </button>

                    <a class="btn btn-outline-secondary"
                       th:href="@{/projects/{id}(id=${project.id})}">
                        Назад к проекту
                    </a>
                </div>
            </form>
        </div>
    </div>
</main>
<script th:src="@{/js/theme.js}"></script>
</body>
</html>
