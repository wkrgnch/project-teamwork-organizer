<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ошибка сервера</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<main class="container py-5">
    <div class="page-card text-center mx-auto" style="max-width: 720px;">
        <div class="display-1 fw-bold text-danger">500</div>
        <h1 class="page-title mb-3">Внутренняя ошибка сервера</h1>
        <p class="text-muted mb-4">
            При обработке запроса произошла ошибка. Попробуйте вернуться назад или открыть главную страницу.
        </p>

        <div class="d-flex justify-content-center gap-2 flex-wrap">
            <a class="btn btn-primary" th:href="@{/}">На главную</a>
            <a class="btn btn-outline-secondary" href="javascript:history.back()">Назад</a>
        </div>
    </div>
</main>

</body>
</html>
