<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Некорректный запрос</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<main class="container py-5">
    <div class="page-card text-center">
        <h1 class="display-5 fw-bold mb-3">400</h1>

        <h2 class="h4 mb-3">Некорректный запрос</h2>

        <p class="text-muted mb-4"
           th:text="${message != null && !message.isBlank() ? message : 'Запрос не может быть обработан. Проверьте введённые данные или вернитесь назад.'}">
            Запрос не может быть обработан.
        </p>

        <div class="d-flex gap-2 justify-content-center">
            <a class="btn btn-primary" th:href="@{/}">
                На главную
            </a>

            <button type="button" class="btn btn-outline-secondary" onclick="history.back()">
                Назад
            </button>
        </div>
    </div>
</main>

</body>
</html>
