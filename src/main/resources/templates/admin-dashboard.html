<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Панель администратора</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4">
    <div class="page-card mb-4">
        <h1 class="page-title mb-2">Панель глобального администратора</h1>
        <p class="text-muted mb-0">
            Сводная информация по системе и доступ к административным функциям.
        </p>
    </div>

    <div class="row g-4">
        <div class="col-md-3">
            <div class="page-card text-center">
                <div class="text-muted">Пользователи</div>
                <div class="display-6 fw-bold" th:text="${usersCount}">0</div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="page-card text-center">
                <div class="text-muted">Проекты</div>
                <div class="display-6 fw-bold" th:text="${projectsCount}">0</div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="page-card text-center">
                <div class="text-muted">Задачи</div>
                <div class="display-6 fw-bold" th:text="${tasksCount}">0</div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="page-card text-center">
                <div class="text-muted">Записи журнала</div>
                <div class="display-6 fw-bold" th:text="${logsCount}">0</div>
            </div>
        </div>
    </div>

    <div class="page-card mt-4">
        <h2 class="h4 mb-3">Администрирование</h2>

        <div class="d-flex gap-2 flex-wrap">
            <a class="btn btn-primary" th:href="@{/logs}">
                Открыть журнал действий
            </a>

            <a class="btn btn-outline-secondary" th:href="@{/work-types}">
                Справочник типов работ
            </a>
        </div>
    </div>
</main>

</body>
</html>
