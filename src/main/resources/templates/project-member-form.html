<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавление участника</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4">
    <div class="form-container">
        <div class="page-card">
            <h1 class="page-title">Добавление участника</h1>

            <p class="text-muted">
                Проект:
                <strong th:text="${project.name}">Название проекта</strong>
            </p>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}">
                Ошибка
            </div>

            <form th:action="@{/projects/{id}/members(id=${project.id})}"
                  th:object="${memberForm}"
                  method="post">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="mb-3">
                    <label for="username" class="form-label">Логин пользователя</label>
                    <input id="username" type="text" th:field="*{username}" class="form-control">
                    <div class="text-danger small" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                </div>

                <div class="mb-4">
                    <label for="roleType" class="form-label">Роль в проекте</label>
                    <select id="roleType" th:field="*{roleType}" class="form-select">
                        <option value="">Выберите роль</option>
                        <option th:each="role : ${roles}"
                                th:value="${role}"
                                th:text="${role}">
                            WORK_EXECUTOR
                        </option>
                    </select>
                    <div class="text-danger small" th:if="${#fields.hasErrors('roleType')}" th:errors="*{roleType}"></div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        Добавить участника
                    </button>

                    <a class="btn btn-outline-secondary"
                       th:href="@{/projects/{id}(id=${project.id})}">
                        Назад к проекту
                    </a>
                </div>
            </form>
        </div>
    </div>
</main>
<script th:src="@{/js/theme.js}"></script>
</body>
</html>
